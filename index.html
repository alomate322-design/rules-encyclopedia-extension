<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Энциклопедия правил</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14131a;
    --bg-raised: #1a1922;
    --bg-raised-2: #211f2b;
    --line: #26242f;
    --text: #e4dfd4;
    --text-dim: #8b859a;
    --accent: #c9a96e;
    --danger: #b06058;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 12.5px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  #search-row { display: flex; gap: 6px; }
  #search {
    flex: 1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    font: inherit;
    padding: 9px 11px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #clear-btn {
    flex-shrink: 0;
    width: 34px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
  }
  #clear-btn:hover { color: var(--accent); border-color: var(--accent); }

  #filters {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
  }
  .filter-chip {
    font-size: 10.5px;
    color: var(--text-dim);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    cursor: pointer;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #1a1410; font-weight: 600; }

  #stats {
    font-size: 10.5px;
    color: var(--text-dim);
    padding: 8px 12px 0;
    flex-shrink: 0;
  }

  #results {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px 14px;
  }
  .result-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .result-row:hover { background: var(--bg-raised); }
  .result-name { font-size: 13.5px; color: var(--text); flex: 1; min-width: 0; }
  .result-name .en { color: var(--text-dim); font-size: 11.5px; margin-left: 5px; }
  .result-badge {
    flex-shrink: 0;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    background: rgba(201, 169, 110, 0.12);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    opacity: 0.9;
  }
  .result-snippet {
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 8px 2px;
    margin-top: -4px;
  }
  #hint, #empty {
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 14px 10px;
    line-height: 1.7;
  }
  #hint b, #empty b { color: var(--text); }

  .browse-cat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid var(--line);
    margin-bottom: 6px;
  }
  .browse-cat:hover { border-color: var(--accent); }
  .browse-cat .label { color: var(--text); }
  .browse-cat .count { color: var(--text-dim); font-size: 11px; }

  .filter-chip.fav-chip { border-color: var(--accent); color: var(--accent); }

  /* ---- звёздочки избранного (видны только мастеру) ---- */
  .star-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .star-btn:hover { color: var(--accent); }
  .star-btn.is-on { color: var(--accent); }
  .star-btn.star-lg { font-size: 21px; padding: 0 2px; }

  .d-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .d-title-row .d-title { flex: 1; min-width: 0; }

  /* ---- группы в списках и оглавлении ---- */
  .group-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 8px 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2px;
  }
  .group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    font-weight: 600;
  }
  .group-count { font-size: 10.5px; color: var(--text-dim); }
  .group-head-lg {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    padding: 14px 4px 6px;
    font-weight: 600;
  }
  .browse-note { font-size: 10.5px; color: var(--text-dim); margin-left: auto; padding-right: 8px; }
  .result-note {
    flex-shrink: 0;
    font-size: 10.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .feature-line { display: flex; align-items: baseline; gap: 8px; }
  .feature-level {
    flex: 0 0 44px;
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* ---- detail view ---- */
  #detail {
    flex: 1;
    overflow-y: auto;
    padding: 4px 14px 20px;
  }
  #detail-back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 8px 0;
  }
  #detail-back:hover { color: var(--accent); }
  .d-title { font-size: 18px; font-weight: 600; margin: 4px 0 2px; }
  .d-title .en { font-size: 13px; color: var(--text-dim); font-weight: 400; margin-left: 6px; }
  .d-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  .d-row {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }
  .d-row .k {
    flex: 0 0 120px;
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding-top: 1px;
  }
  .d-row .v { flex: 1; min-width: 0; }
  .d-desc {
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .d-block-title {
    font-size: 13px;
    font-weight: 600;
    margin: 16px 0 6px;
    color: var(--accent);
  }
  .d-entry { font-size: 12.5px; line-height: 1.55; margin-bottom: 8px; }
  .d-entry b { color: var(--text); }
  .ref-link {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
    border-bottom: 1px dotted var(--accent);
  }
  .ref-link:hover { border-bottom-style: solid; }
</style>
</head>
<body>
  <header>
    <h1>Энциклопедия правил · D&amp;D 5e 2014</h1>
    <div id="search-row">
      <input id="search" type="text" placeholder="Ищи: класс, заклинание, монстр, состояние…" autocomplete="off" />
      <button type="button" id="clear-btn" title="Очистить">✕</button>
    </div>
    <div id="filters"></div>
  </header>

  <div id="stats"></div>
  <div id="results"></div>
  <div id="detail" hidden></div>

  <script type="module" src="./app.js?v=2"></script>
</body>
</html>
